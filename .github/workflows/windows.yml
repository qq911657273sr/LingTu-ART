name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install FFmpeg and Inno Setup
        shell: pwsh
        run: choco install ffmpeg innosetup -y --no-progress
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Run acceptance suites
        run: |
          python tests/acceptance.py
          python tests/ai_acceptance.py
      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: .\packaging\build-windows.ps1
      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LingTu-ART-Windows
          path: output/installer/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LingTu-ART-Windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: 灵图 ART ${{ github.ref_name }}
          body: |
            灵图 ART 是面向 AI 创作者的本地美术素材库，支持图片与视频管理、分类标签、收藏、搜索、全图预览和可选 AI 修图。

            Windows 安装包：下载下方 `LingTu-ART-Setup-1.3.11.exe` 并运行安装。首次启动后可在设置中配置兼容 OpenAI 的模型接口、Gemini 或 RunningHub；AI 服务按需启用。

            素材默认保存在本机。详细功能、安装步骤和许可说明请查看仓库 README。
          files: release/*.exe

