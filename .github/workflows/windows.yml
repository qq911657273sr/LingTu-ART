name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install FFmpeg and Inno Setup
        shell: pwsh
        run: choco install ffmpeg innosetup -y --no-progress
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Run acceptance suites
        run: |
          python tests/acceptance.py
          python tests/ai_acceptance.py
      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: .\packaging\build-windows.ps1
      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LingTu-ART-Windows
          path: output/installer/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LingTu-ART-Windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
